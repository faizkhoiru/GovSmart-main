services:
  db:
    image: mysql:8.0
    container_name: govsmart_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: govsmart
      MYSQL_USER: govsmart_user
      MYSQL_PASSWORD: govsmart_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: govsmart_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MYSQL_USER=govsmart_user
      - MYSQL_PASSWORD=govsmart_password
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DB=govsmart
      - SECRET_KEY=supersecretkeygovsmart2026!
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CHATBOT_URL=http://chatbot:8001
      - CHATBOT_INTERNAL_TOKEN=${CHATBOT_INTERNAL_TOKEN:-govsmart-dev-token}
      - CHATBOT_TIMEOUT=180
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - ./frontend/dist:/app/frontend-dist:ro
    depends_on:
      db:
        condition: service_healthy

  chatbot:
    build:
      context: ./govsmart-chatbot
      dockerfile: Dockerfile
    container_name: govsmart_chatbot
    restart: always
    ports:
      - "8001:8001"
    environment:
      - CHATBOT_INTERNAL_TOKEN=${CHATBOT_INTERNAL_TOKEN:-govsmart-dev-token}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen2:1.5b}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.35}
      - PROMPT_RINGKAS=${PROMPT_RINGKAS:-1}
    volumes:
      # Index RAG dan skrip layanan chatbot dipasang agar selalu sinkron dengan kode terbaru.
      - ./govsmart-chatbot/data:/app/data:ro
      - ./govsmart-chatbot/scripts:/app/scripts:ro
      - ./govsmart-chatbot/service.py:/app/service.py:ro

volumes:
  mysql_data:
  uploads_data:

