[tool.poetry]
name = "govsmart-backend"
version = "0.1.0"
description = "GovSmart E-Governance & Pengaduan AI Backend"
authors = ["GovSmart Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "0.104.1"
uvicorn = "0.24.0"
sqlalchemy = "2.0.23"
pydantic = {extras = ["email"], version = "2.5.0"}
pydantic-settings = "2.1.0"
python-jose = {extras = ["cryptography"], version = "3.3.0"}
python-dotenv = "1.0.0"
pymysql = "1.1.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "0.0.6"
bcrypt = "4.0.1"



[tool.poetry.group.dev.dependencies]
pytest = "7.4.3"
pytest-asyncio = "0.21.1"
pytest-cov = "4.1.0"
httpx = "0.25.2"
black = "23.12.0"

flake8 = "6.1.0"
pylint = "3.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
